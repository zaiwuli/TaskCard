<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>TaskCard · 随机任务抽取 & 配图生成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2329;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    button, select, input, textarea { touch-action: manipulation; }
    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      padding: 26px 28px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }
    .lib-switcher {
      width: auto;
      max-width: 220px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #e5e6eb;
      background: #f8f9fb;
      color: #1f2329;
      cursor: pointer;
    }
    .brand {
      font-size: 12.5px;
      color: #8f959e;
      font-weight: 500;
      letter-spacing: 0.4px;
    }
    .result-box {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      margin-bottom: 22px;
      background: #f8f9fb;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.55;
      color: #1f2329;
      word-break: break-word;
      white-space: pre-wrap;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }
    .result-box.placeholder {
      font-size: 16px;
      font-weight: 400;
      color: #8f959e;
    }
    .result-box.pop {
      transform: scale(0.97);
      opacity: 0.55;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      flex: 1.2;
      background: #1f2329;
      color: #fff;
    }
    .btn-primary:hover { background: #333942; }
    .btn-save {
      flex: 1;
      background: #fff;
      color: #1f2329;
      border: 1.5px solid #d0d3d9;
    }
    .btn-save:hover {
      background: #f8f9fb;
      border-color: #1f2329;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .toast {
      min-height: 20px;
      margin-top: 12px;
      font-size: 12.5px;
      color: #0f766e;
      word-break: break-all;
    }
    .toast.error { color: #dc2626; }
    .footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #8f959e;
      gap: 6px;
      flex-wrap: wrap;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .link-btn {
      background: none;
      border: none;
      color: #646a73;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 6px;
    }
    .link-btn:hover, .link-btn.active {
      background: #f2f3f5;
      color: #1f2329;
    }

    .panel {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eff0f1;
      text-align: left;
    }
    .panel.open { display: block; }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: #646a73;
      margin-bottom: 6px;
    }
    textarea, input[type="text"], input[type="number"], input[type="date"], input[type="time"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dee0e3;
      border-radius: 8px;
      font-size: 13.5px;
      color: #1f2329;
      background: #fff;
      font-family: inherit;
      outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: #1f2329; }
    textarea { resize: vertical; line-height: 1.55; }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row > * { flex: 1; }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #4e5969;
      cursor: pointer;
      user-select: none;
    }
    .swatches {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch.active {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1f2329;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      background: #f2f3f5;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .small-btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #dee0e3;
      background: #fff;
      color: #1f2329;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto !important;
    }
    .small-btn:hover { background: #f5f6f8; }
    .small-btn-dark {
      background: #1f2329;
      color: #fff;
      border-color: #1f2329;
    }
    .small-btn-dark:hover { background: #333942; }
    .small-btn-danger {
      color: #dc2626;
      border-color: #fecaca;
    }
    .small-btn-danger:hover { background: #fef2f2; }
    .hint {
      font-size: 12px;
      color: #8f959e;
      margin-top: 6px;
      line-height: 1.5;
    }
    .status-box {
      background: #f8f9fb;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: #4e5969;
      line-height: 1.6;
      white-space: pre-line;
    }
    input[type="range"] { width: 100%; accent-color: #1f2329; }
    input[type="color"] {
      width: 34px;
      height: 30px;
      padding: 2px;
      border: 1px solid #dee0e3;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      flex: 0 0 auto !important;
    }

    /* Mobile Optimization */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: calc(12px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));
      }
      .container {
        padding: 20px 18px 18px;
        border-radius: 18px;
      }
      .top-bar {
        margin-bottom: 14px;
      }
      .lib-switcher {
        max-width: 72%;
        min-height: 38px;
        padding: 6px 12px;
        font-size: 15px;
      }
      .result-box {
        min-height: 148px;
        padding: 22px 16px;
        margin-bottom: 18px;
        font-size: 20px;
      }
      .btn {
        height: 52px;
        font-size: 16px;
        border-radius: 14px;
      }
      .footer {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 12px;
      }
      .footer > div:first-child {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .footer-right {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        background: #f5f6f8;
        padding: 4px;
        border-radius: 10px;
      }
      .footer-right .link-btn {
        padding: 9px 4px;
        font-size: 13.5px;
        border-radius: 8px;
        text-align: center;
      }
      .footer-right .link-btn.active {
        background: #fff;
        color: #1f2329;
        font-weight: 500;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      /* Prevent iOS Safari auto-zoom on focus (requires >= 16px) */
      textarea, input[type="text"], input[type="number"], input[type="date"], input[type="time"], select {
        font-size: 16px;
        padding: 10px 12px;
      }
      .small-btn {
        min-height: 42px;
        padding: 8px 12px;
        font-size: 14px;
      }
      .row {
        flex-wrap: wrap;
      }
      .swatch {
        width: 32px;
        height: 32px;
      }
      input[type="color"] {
        width: 40px;
        height: 36px;
      }
      .checkbox-label {
        font-size: 14px;
        min-height: 32px;
      }
      .checkbox-label input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }
      #previewCanvas {
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <select id="libSelect" class="lib-switcher" title="切换任务库"></select>
      <span class="brand">TaskCard</span>
    </div>

    <div id="result" class="result-box placeholder">点击下方按钮抽取一个任务</div>

    <div class="actions">
      <button id="drawBtn" class="btn btn-primary">抽取任务</button>
      <button id="saveImgBtn" class="btn btn-save">生成配图</button>
    </div>

    <div id="toast" class="toast"></div>

    <div class="footer">
      <div>
        <span id="statusText">共 0 个任务</span>
        <button id="resetBtn" class="link-btn" style="display:none;">重置本库</button>
      </div>
      <div class="footer-right">
        <button id="toggleScheduleBtn" class="link-btn">定时任务</button>
        <button id="toggleCardBtn" class="link-btn">配图设置</button>
        <button id="toggleEditorBtn" class="link-btn">任务库</button>
      </div>
    </div>

    <!-- 定时任务面板 -->
    <div id="schedulePanel" class="panel">
      <div class="field">
        <div class="field-label">
          <label class="checkbox-label">
            <input type="checkbox" id="schedEnabled" />
            开启每日定时按库自动生成
          </label>
          <span id="schedModeTag" style="font-size:12px;"></span>
        </div>
      </div>

      <div class="field">
        <div class="row">
          <div>
            <div class="field-label"><span>每天执行时间</span></div>
            <input type="time" id="schedTime" value="00:00" />
          </div>
          <div>
            <div class="field-label"><span>每库默认张数</span></div>
            <input type="number" id="schedCount" value="20" min="1" max="500" />
          </div>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <span>日期目录后缀（留空则直接 20261126/库名/）</span>
        </div>
        <input type="text" id="schedSuffix" value="" placeholder="留空即可，自动建 20261126/1号库/ ..." />
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="autoResetOnEmpty" checked />
          单库任务全部抽完后自动开启新一轮（本轮结束前绝不重复）
        </label>
      </div>

      <div class="field">
        <div class="row">
          <button type="button" id="saveSchedBtn" class="small-btn small-btn-dark" style="flex:1 !important;">保存定时设置</button>
          <button type="button" id="runBatchNowBtn" class="small-btn" style="flex:1 !important;">立即按库批量生成</button>
        </div>
      </div>

      <div class="field">
        <div id="schedStatusBox" class="status-box">尚未执行定时任务</div>
      </div>
    </div>

    <!-- 配图设置面板 -->
    <div id="cardPanel" class="panel">
      <div class="preview-wrap">
        <canvas id="previewCanvas"></canvas>
      </div>

      <div class="field">
        <div class="field-label"><span>配图文字（支持多行，抽任务自动同步）</span></div>
        <textarea id="cardText" rows="3" placeholder="输入要印在图片上的字..."></textarea>
      </div>

      <div class="field">
        <div class="field-label">
          <span>画布比例</span>
          <span id="sizeLabel">1080 × 1440</span>
        </div>
        <select id="ratioPreset">
          <option value="1080x1440">小红书 3:4 (1080×1440)</option>
          <option value="1080x1080">朋友圈 1:1 (1080×1080)</option>
          <option value="1080x1920">竖屏 9:16 (1080×1920)</option>
          <option value="custom">自定义尺寸</option>
        </select>
        <div id="customSizeRow" class="row" style="margin-top:8px; display:none;">
          <input type="number" id="customW" value="1080" min="200" max="4096" placeholder="宽" />
          <input type="number" id="customH" value="1440" min="200" max="4096" placeholder="高" />
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <span>字体与字号</span>
          <span id="fontSizeVal">64px</span>
        </div>
        <select id="fontFamily" style="margin-bottom:8px;">
          <option value='"PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif'>简约黑体（默认）</option>
          <option value='"Songti SC", "SimSun", "Noto Serif SC", serif'>文艺宋体</option>
          <option value='"Kaiti SC", "KaiTi", "STKaiti", serif'>手写楷体</option>
          <option value='"YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif'>柔和圆体</option>
          <option value='"Consolas", "SFMono-Regular", "Microsoft YaHei", monospace'>等宽代码风</option>
        </select>
        <input type="range" id="fontSize" min="32" max="130" value="64" />
      </div>

      <div class="field">
        <div class="field-label"><span>背景配色 / 底图</span></div>
        <div class="row" style="margin-bottom:8px;">
          <div class="swatches" id="themeSwatches"></div>
          <input type="color" id="bgColor" title="背景色" value="#ffffff" />
          <input type="color" id="textColor" title="文字色" value="#1f2329" />
        </div>
        <div class="row">
          <input type="file" id="bgImageInput" accept="image/*" style="font-size:12px; padding:5px;" />
          <button type="button" id="clearBgImgBtn" class="small-btn" style="display:none;">清除底图</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <label class="checkbox-label">
            <input type="checkbox" id="showDate" checked />
            显示默认日期
          </label>
          <select id="datePos" style="width:auto; padding:4px 8px; font-size:12px;">
            <option value="bottom-right">右下角</option>
            <option value="bottom-center">底部居中</option>
            <option value="top-left">左上角</option>
          </select>
        </div>
        <input type="date" id="dateValue" />
      </div>

      <div class="field">
        <div class="field-label">
          <span>保存目录后缀</span>
          <span id="folderPreview" style="color:#1f2329; font-weight:500;"></span>
        </div>
        <div class="row">
          <input type="text" id="folderSuffix" placeholder="留空则直接 20261126/库名/" value="" />
          <button type="button" id="pickDirBtn" class="small-btn">选择文件夹</button>
        </div>
        <div id="saveModeHint" class="hint"></div>
      </div>
    </div>

    <!-- 任务库管理与编辑面板 -->
    <div id="editorPanel" class="panel">
      <div class="field">
        <div class="field-label">
          <span>管理任务库（每个库独立子文件夹 & 独立防重复）</span>
        </div>
        <div class="row">
          <input type="text" id="libNameInput" placeholder="当前库名称，如 1号库" />
          <button type="button" id="addLibBtn" class="small-btn">+ 新建库</button>
          <button type="button" id="delLibBtn" class="small-btn small-btn-danger">删除</button>
        </div>
      </div>

      <div class="field">
        <div class="row">
          <label class="checkbox-label" style="flex:1.2;">
            <input type="checkbox" id="libEnabled" checked />
            参与定时生成
          </label>
          <input type="number" id="libCount" min="0" max="500" placeholder="本库张数(0=用默认)" title="填 0 或留空表示沿用定时任务的默认张数" />
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <span>任务内容（多行任务用单独一行 --- 隔开）</span>
          <label class="checkbox-label">
            <input type="checkbox" id="noRepeat" checked />
            本轮不重复
          </label>
        </div>
        <textarea id="taskInput" rows="9" placeholder="任务一第一行&#10;任务一第二行&#10;---&#10;任务二"></textarea>
        <div class="row" style="margin-top:8px;">
          <input type="file" id="importTxtInput" accept=".txt,.md,.csv,text/plain" style="display:none;" />
          <button type="button" id="importTxtBtn" class="small-btn">导入 TXT</button>
          <button type="button" id="exportTxtBtn" class="small-btn">导出 TXT</button>
        </div>
        <div class="hint">若文本中包含单独一行 ---，则按 --- 拆分多行任务；否则按每行 1 条拆分。</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'taskcard_state_v4';
    const DEFAULT_TASKS = [
      '今日自律打卡\n早起喝一杯温水\n记录当下感受',
      '整理手机相册\n删掉 20 张不需要的照片',
      '读完一本书的任意一个章节\n写 1 句话总结',
      '晚饭后出门散步 20 分钟\n全程不看手机',
      '清理电脑桌面和下载文件夹'
    ];

    const THEMES = [
      { name: '极简白', bg: '#ffffff', card: '#f8f9fb', text: '#1f2329', accent: '#8f959e' },
      { name: '暖纸米', bg: '#f6f1e7', card: '#fbf8f2', text: '#3a3226', accent: '#9c8b73' },
      { name: '雾霾蓝', bg: '#e8eff5', card: '#f4f8fb', text: '#1e3346', accent: '#6d859c' },
      { name: '温柔粉', bg: '#f9ecef', card: '#fdf6f7', text: '#4a2c35', accent: '#a87d89' },
      { name: '森系绿', bg: '#eaf2ec', card: '#f4f9f5', text: '#213b2a', accent: '#6b8c76' },
      { name: '暗夜黑', bg: '#16181d', card: '#20232a', text: '#f3f4f6', accent: '#9ca3af' }
    ];

    const libSelect = document.getElementById('libSelect');
    const resultEl = document.getElementById('result');
    const drawBtn = document.getElementById('drawBtn');
    const saveImgBtn = document.getElementById('saveImgBtn');
    const toastEl = document.getElementById('toast');
    const statusText = document.getElementById('statusText');
    const resetBtn = document.getElementById('resetBtn');
    const toggleScheduleBtn = document.getElementById('toggleScheduleBtn');
    const toggleCardBtn = document.getElementById('toggleCardBtn');
    const toggleEditorBtn = document.getElementById('toggleEditorBtn');
    const schedulePanel = document.getElementById('schedulePanel');
    const cardPanel = document.getElementById('cardPanel');
    const editorPanel = document.getElementById('editorPanel');

    // Library controls
    const libNameInput = document.getElementById('libNameInput');
    const addLibBtn = document.getElementById('addLibBtn');
    const delLibBtn = document.getElementById('delLibBtn');
    const libEnabledEl = document.getElementById('libEnabled');
    const libCountEl = document.getElementById('libCount');
    const taskInput = document.getElementById('taskInput');
    const importTxtInput = document.getElementById('importTxtInput');
    const importTxtBtn = document.getElementById('importTxtBtn');
    const exportTxtBtn = document.getElementById('exportTxtBtn');
    const noRepeatEl = document.getElementById('noRepeat');

    // Schedule controls
    const schedEnabledEl = document.getElementById('schedEnabled');
    const schedTimeEl = document.getElementById('schedTime');
    const schedCountEl = document.getElementById('schedCount');
    const schedSuffixEl = document.getElementById('schedSuffix');
    const autoResetOnEmptyEl = document.getElementById('autoResetOnEmpty');
    const saveSchedBtn = document.getElementById('saveSchedBtn');
    const runBatchNowBtn = document.getElementById('runBatchNowBtn');
    const schedModeTag = document.getElementById('schedModeTag');
    const schedStatusBox = document.getElementById('schedStatusBox');

    // Card controls
    const previewCanvas = document.getElementById('previewCanvas');
    const cardTextEl = document.getElementById('cardText');
    const ratioPresetEl = document.getElementById('ratioPreset');
    const customSizeRow = document.getElementById('customSizeRow');
    const customWEl = document.getElementById('customW');
    const customHEl = document.getElementById('customH');
    const sizeLabelEl = document.getElementById('sizeLabel');
    const fontFamilyEl = document.getElementById('fontFamily');
    const fontSizeEl = document.getElementById('fontSize');
    const fontSizeValEl = document.getElementById('fontSizeVal');
    const themeSwatchesEl = document.getElementById('themeSwatches');
    const bgColorEl = document.getElementById('bgColor');
    const textColorEl = document.getElementById('textColor');
    const bgImageInput = document.getElementById('bgImageInput');
    const clearBgImgBtn = document.getElementById('clearBgImgBtn');
    const showDateEl = document.getElementById('showDate');
    const dateValueEl = document.getElementById('dateValue');
    const datePosEl = document.getElementById('datePos');
    const folderSuffixEl = document.getElementById('folderSuffix');
    const folderPreviewEl = document.getElementById('folderPreview');
    const pickDirBtn = document.getElementById('pickDirBtn');
    const saveModeHint = document.getElementById('saveModeHint');

    let serverMode = false;
    let serverOutputDir = '';
    let serverFontLoaded = '';
    let selectedDirHandle = null;
    let bgImageObj = null;
    let syncTimer = null;

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseTasksText(raw) {
      const text = String(raw || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const hasDivider = /^\s*---\s*$/m.test(text);
      const chunks = hasDivider ? text.split(/^\s*---\s*$/m) : text.split('\n');
      const seen = new Set();
      const out = [];
      for (let item of chunks) {
        item = item.trim();
        if (!item) continue;
        if (!seen.has(item)) {
          seen.add(item);
          out.push(item);
        }
      }
      return out;
    }

    function serializeTasksText(tasks) {
      if (!Array.isArray(tasks) || tasks.length === 0) return '';
      const hasMultiline = tasks.some(t => t.includes('\n'));
      return hasMultiline ? tasks.join('\n---\n') : tasks.join('\n');
    }

    function defaultLocalState() {
      return {
        libraries: [
          {
            id: 'lib-1',
            name: '1号库',
            tasks: [...DEFAULT_TASKS],
            remaining: [...DEFAULT_TASKS],
            round: 1,
            enabled: true,
            count: 0
          }
        ],
        activeLibraryId: 'lib-1',
        noRepeat: true,
        currentTask: '',
        card: {
          ratio: '1080x1440',
          customW: 1080,
          customH: 1440,
          fontFamily: '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif',
          fontSize: 64,
          themeIndex: 0,
          bgColor: '#ffffff',
          cardColor: '#f8f9fb',
          textColor: '#1f2329',
          accentColor: '#8f959e',
          showDate: true,
          datePos: 'bottom-right',
          suffix: ''
        },
        schedule: {
          enabled: false,
          time: '00:00',
          count: 20,
          suffix: '',
          autoResetOnEmpty: true,
          lastRunDate: '',
          lastRunTime: '',
          lastRunSummary: ''
        }
      };
    }

    let state = loadLocalState();

    function loadLocalState() {
      const def = defaultLocalState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.libraries) && parsed.libraries.length > 0) {
            return {
              ...def,
              ...parsed,
              card: { ...def.card, ...(parsed.card || {}) },
              schedule: { ...def.schedule, ...(parsed.schedule || {}) }
            };
          }
        }
      } catch (_) {}
      return def;
    }

    function getActiveLib() {
      return state.libraries.find(l => l.id === state.activeLibraryId) || state.libraries[0];
    }

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function scheduleSyncToServer(payload, immediate = false) {
      persistLocal();
      if (!serverMode) return Promise.resolve();
      const send = async () => {
        try {
          const res = await fetch('/api/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data && data.ok && data.state) {
            state = data.state;
            renderLibSelect();
            updateStatus();
            updateFolderPreview();
            updateScheduleUI();
          }
        } catch (_) {}
      };
      clearTimeout(syncTimer);
      if (immediate) return send();
      syncTimer = setTimeout(send, 260);
      return Promise.resolve();
    }

    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('error', isError);
    }

    function secureRandomInt(max) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % max;
    }

    function renderLibSelect() {
      const active = getActiveLib();
      libSelect.innerHTML = '';
      state.libraries.forEach(lib => {
        const opt = document.createElement('option');
        opt.value = lib.id;
        opt.textContent = `${lib.name} (${lib.tasks.length})`;
        if (active && lib.id === active.id) opt.selected = true;
        libSelect.appendChild(opt);
      });
      delLibBtn.disabled = state.libraries.length <= 1;
    }

    function loadActiveLibIntoEditor() {
      const lib = getActiveLib();
      if (!lib) return;
      libNameInput.value = lib.name;
      libEnabledEl.checked = lib.enabled !== false;
      libCountEl.value = lib.count > 0 ? lib.count : '';
      taskInput.value = serializeTasksText(lib.tasks);
    }

    function updateStatus() {
      const lib = getActiveLib();
      if (!lib || lib.tasks.length === 0) {
        statusText.textContent = `${lib ? lib.name : '当前库'} · 暂无任务`;
        resetBtn.style.display = 'none';
        return;
      }
      const total = lib.tasks.length;
      if (state.noRepeat) {
        const rem = (lib.remaining || []).length;
        statusText.textContent = `第 ${lib.round || 1} 轮 · 剩余 ${rem}/${total}`;
        resetBtn.style.display = rem < total || (lib.round || 1) > 1 ? 'inline-block' : 'none';
      } else {
        statusText.textContent = `共 ${total} 个任务`;
        resetBtn.style.display = 'none';
      }
    }

    function showResult(text, isPlaceholder = false) {
      resultEl.classList.add('pop');
      setTimeout(() => {
        resultEl.textContent = text;
        resultEl.classList.toggle('placeholder', isPlaceholder);
        resultEl.classList.remove('pop');
      }, 90);
    }

    async function drawTask() {
      const lib = getActiveLib();
      if (!lib) return;

      if (serverMode) {
        drawBtn.disabled = true;
        try {
          const res = await fetch('/api/draw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ libraryId: lib.id })
          });
          const data = await res.json();
          if (data.state) state = data.state;
          if (!data.ok) {
            showToast(data.error || '当前任务库没有可抽取的任务', true);
            updateStatus();
            return;
          }
          showResult(data.task, false);
          cardTextEl.value = data.task;
          showToast('');
          renderLibSelect();
          updateStatus();
          renderCanvas(previewCanvas, true);
        } catch (err) {
          showToast(`抽取失败：${err.message}`, true);
        } finally {
          drawBtn.disabled = false;
        }
        return;
      }

      if (lib.tasks.length === 0) {
        openPanel('editor');
        showResult('请先在当前任务库输入任务', true);
        return;
      }
      let task = '';
      if (!state.noRepeat) {
        task = lib.tasks[secureRandomInt(lib.tasks.length)];
      } else {
        if (!lib.remaining || lib.remaining.length === 0) {
          lib.remaining = [...lib.tasks];
          lib.round = (lib.round || 1) + 1;
        }
        const idx = secureRandomInt(lib.remaining.length);
        task = lib.remaining.splice(idx, 1)[0];
      }
      state.currentTask = task;
      persistLocal();
      showResult(task, false);
      cardTextEl.value = task;
      showToast('');
      updateStatus();
      renderCanvas(previewCanvas, true);
    }

    function openPanel(which) {
      const panels = [
        ['schedule', schedulePanel, toggleScheduleBtn],
        ['card', cardPanel, toggleCardBtn],
        ['editor', editorPanel, toggleEditorBtn]
      ];
      for (const [key, panel, btn] of panels) {
        const shouldOpen = key === which && !panel.classList.contains('open');
        panel.classList.toggle('open', shouldOpen);
        btn.classList.toggle('active', shouldOpen);
        if (shouldOpen && key === 'card') renderCanvas(previewCanvas, true);
        if (shouldOpen && key === 'editor') loadActiveLibIntoEditor();
        if (shouldOpen && window.innerWidth <= 600) {
          setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
        }
      }
    }

    function getCanvasDims() {
      if (state.card.ratio === 'custom') {
        const w = Math.max(200, Math.min(4096, Number(state.card.customW) || 1080));
        const h = Math.max(200, Math.min(4096, Number(state.card.customH) || 1440));
        return { w, h };
      }
      const [w, h] = state.card.ratio.split('x').map(Number);
      return { w, h };
    }

    function getDateFolderName() {
      const rawDate = (dateValueEl.value || getTodayStr()).replace(/-/g, '');
      const suffix = (state.card.suffix || '').trim().replace(/[\\/:*?"<>|]/g, '');
      return suffix ? `${rawDate}_${suffix}` : rawDate;
    }

    function getCleanLibFolder() {
      const lib = getActiveLib();
      return ((lib && lib.name) || '1号库').trim().replace(/[\\/:*?"<>|]/g, '') || '1号库';
    }

    function updateFolderPreview() {
      const dateFolder = getDateFolderName();
      const libFolder = getCleanLibFolder();
      folderPreviewEl.textContent = `${dateFolder}/${libFolder}/`;
      if (serverMode) {
        pickDirBtn.style.display = 'none';
        saveModeHint.textContent = `NAS/Docker 模式：直接保存到 ${serverOutputDir || '/output'}/${dateFolder}/${libFolder}/` +
          (serverFontLoaded ? `（字体：${serverFontLoaded}）` : '');
      } else if (window.showDirectoryPicker) {
        pickDirBtn.style.display = 'inline-block';
        saveModeHint.textContent = selectedDirHandle
          ? `已选本地目录：「${selectedDirHandle.name}」，将存入 ${dateFolder}/${libFolder}/`
          : '首次点击「生成配图」或右侧按钮选择本地文件夹即可自动建子目录保存';
      } else {
        pickDirBtn.style.display = 'none';
        saveModeHint.textContent = '离线模式：点击「生成配图」自动下载 PNG（部署到 NAS Docker 后自动按库建目录并支持定时生成）';
      }
    }

    function updateScheduleUI() {
      schedEnabledEl.checked = !!state.schedule.enabled;
      schedTimeEl.value = state.schedule.time || '00:00';
      schedCountEl.value = state.schedule.count || 20;
      schedSuffixEl.value = state.schedule.suffix || '';
      autoResetOnEmptyEl.checked = state.schedule.autoResetOnEmpty !== false;

      const enabledLibs = state.libraries.filter(l => l.enabled !== false && l.tasks.length > 0);
      const libDesc = enabledLibs.length > 0
        ? enabledLibs.map(l => `${l.name}(${l.count > 0 ? l.count : (state.schedule.count || 20)}张)`).join('、')
        : '暂无已启用的非空任务库';

      if (serverMode) {
        schedModeTag.textContent = state.schedule.enabled ? '● 运行中' : '○ 未开启';
        schedModeTag.style.color = state.schedule.enabled ? '#0f766e' : '#8f959e';
        saveSchedBtn.disabled = false;
        runBatchNowBtn.disabled = false;
        const lines = [
          `定时计划：${state.schedule.enabled ? `每天 ${state.schedule.time}` : '未开启'}`,
          `参与库：${libDesc}`,
          state.schedule.lastRunSummary
            ? `最近执行（${state.schedule.lastRunTime || ''}）：${state.schedule.lastRunSummary}`
            : '最近执行：暂无记录'
        ];
        schedStatusBox.textContent = lines.join('\n');
      } else {
        schedModeTag.textContent = '需 Docker / NAS 运行';
        schedModeTag.style.color = '#d97706';
        saveSchedBtn.disabled = true;
        runBatchNowBtn.disabled = true;
        schedStatusBox.textContent = `当前为离线静态页；部署到 NAS Docker 后，将按「日期/任务库/」自动批量生成。\n当前参与库：${libDesc}`;
      }
    }

    function wrapLines(ctx, text, maxWidth) {
      const paragraphs = (text || '').split(/\r?\n/);
      const lines = [];
      for (const para of paragraphs) {
        if (!para) { lines.push(''); continue; }
        let line = '';
        for (const ch of para) {
          const test = line + ch;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = ch;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function renderCanvas(targetCanvas, isPreview = false) {
      const { w, h } = getCanvasDims();
      sizeLabelEl.textContent = `${w} × ${h}`;
      const scale = isPreview ? Math.min(1, 520 / Math.max(w, h)) : 1;
      targetCanvas.width = Math.round(w * scale);
      targetCanvas.height = Math.round(h * scale);

      const ctx = targetCanvas.getContext('2d');
      ctx.save();
      ctx.scale(scale, scale);

      if (bgImageObj) {
        const imgRatio = bgImageObj.width / bgImageObj.height;
        const canvasRatio = w / h;
        let sx = 0, sy = 0, sw = bgImageObj.width, sh = bgImageObj.height;
        if (imgRatio > canvasRatio) {
          sw = bgImageObj.height * canvasRatio;
          sx = (bgImageObj.width - sw) / 2;
        } else {
          sh = bgImageObj.width / canvasRatio;
          sy = (bgImageObj.height - sh) / 2;
        }
        ctx.drawImage(bgImageObj, sx, sy, sw, sh, 0, 0, w, h);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        const pad = Math.round(Math.min(w, h) * 0.07);
        drawRoundRect(ctx, pad, pad, w - pad * 2, h - pad * 2, 36);
        ctx.fill();
      } else {
        ctx.fillStyle = state.card.bgColor;
        ctx.fillRect(0, 0, w, h);
        const pad = Math.round(Math.min(w, h) * 0.065);
        ctx.fillStyle = state.card.cardColor || state.card.bgColor;
        drawRoundRect(ctx, pad, pad, w - pad * 2, h - pad * 2, 36);
        ctx.fill();
      }

      const text = (cardTextEl.value || state.currentTask || '你好').trim();
      const fontSize = Number(state.card.fontSize) || 64;
      const lineHeight = Math.round(fontSize * 1.55);
      const maxWidth = w - Math.round(w * 0.28);

      ctx.fillStyle = state.card.textColor;
      ctx.font = `600 ${fontSize}px ${state.card.fontFamily}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const lines = wrapLines(ctx, text, maxWidth);
      const totalH = lines.length * lineHeight;
      const startY = (h - totalH) / 2 + lineHeight / 2;
      lines.forEach((line, idx) => ctx.fillText(line, w / 2, startY + idx * lineHeight));

      if (state.card.showDate) {
        const dateStr = dateValueEl.value || getTodayStr();
        const dateFont = Math.max(24, Math.round(Math.min(w, h) * 0.03));
        ctx.fillStyle = state.card.accentColor || '#8f959e';
        ctx.font = `400 ${dateFont}px ${state.card.fontFamily}`;
        const margin = Math.round(Math.min(w, h) * 0.11);
        if (state.card.datePos === 'bottom-right') {
          ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
          ctx.fillText(dateStr, w - margin, h - margin);
        } else if (state.card.datePos === 'bottom-center') {
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(dateStr, w / 2, h - margin);
        } else {
          ctx.textAlign = 'left'; ctx.textBaseline = 'top';
          ctx.fillText(dateStr, margin, margin);
        }
      }
      ctx.restore();
    }

    function buildFileName(text) {
      const now = new Date();
      const ts = `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
      const firstLine = (text || 'task').split(/\r?\n/)[0];
      const clean = firstLine.replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 16) || 'task';
      return `${ts}_${clean}.png`;
    }

    async function saveImage() {
      const text = (cardTextEl.value || state.currentTask || '').trim();
      if (!text) {
        showToast('请先抽取一个任务，或在「配图设置」里输入文字', true);
        return;
      }
      const exportCanvas = document.createElement('canvas');
      renderCanvas(exportCanvas, false);
      const dateFolder = getDateFolderName();
      const libFolder = getCleanLibFolder();
      const fileName = buildFileName(text);

      if (serverMode) {
        saveImgBtn.disabled = true;
        try {
          const resp = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              imageBase64: exportCanvas.toDataURL('image/png'),
              date: dateValueEl.value || getTodayStr(),
              suffix: (state.card.suffix || '').trim(),
              libraryName: libFolder,
              fileName
            })
          });
          const json = await resp.json();
          if (!resp.ok || !json.ok) throw new Error(json.error || '保存失败');
          showToast(`已保存：${json.path}`);
        } catch (err) {
          showToast(`保存失败：${err.message}`, true);
        } finally {
          saveImgBtn.disabled = false;
        }
        return;
      }

      if (window.showDirectoryPicker) {
        try {
          if (!selectedDirHandle) {
            selectedDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            updateFolderPreview();
          }
          const dDir = await selectedDirHandle.getDirectoryHandle(dateFolder, { create: true });
          const lDir = await dDir.getDirectoryHandle(libFolder, { create: true });
          const fileHandle = await lDir.getFileHandle(fileName, { create: true });
          const writable = await fileHandle.createWritable();
          const blob = await new Promise(resolve => exportCanvas.toBlob(resolve, 'image/png'));
          await writable.write(blob);
          await writable.close();
          showToast(`已保存：${selectedDirHandle.name}/${dateFolder}/${libFolder}/${fileName}`);
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') { showToast('已取消选择目录', true); return; }
        }
      }

      const link = document.createElement('a');
      link.download = `${dateFolder}_${libFolder}_${fileName}`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
      showToast(`已下载：${dateFolder}_${libFolder}_${fileName}`);
    }

    function initThemes() {
      themeSwatchesEl.innerHTML = '';
      THEMES.forEach((t, idx) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'swatch' + (state.card.themeIndex === idx ? ' active' : '');
        el.title = t.name;
        el.style.background = t.bg;
        el.addEventListener('click', () => {
          state.card.themeIndex = idx;
          state.card.bgColor = t.bg;
          state.card.cardColor = t.card;
          state.card.textColor = t.text;
          state.card.accentColor = t.accent;
          bgColorEl.value = t.bg;
          textColorEl.value = t.text;
          scheduleSyncToServer({ card: state.card });
          initThemes();
          renderCanvas(previewCanvas, true);
        });
        themeSwatchesEl.appendChild(el);
      });
    }

    function applyStateToUI() {
      renderLibSelect();
      loadActiveLibIntoEditor();
      noRepeatEl.checked = state.noRepeat;
      if (state.currentTask) {
        showResult(state.currentTask, false);
        cardTextEl.value = state.currentTask;
      }
      ratioPresetEl.value = state.card.ratio || '1080x1440';
      customSizeRow.style.display = state.card.ratio === 'custom' ? 'flex' : 'none';
      customWEl.value = state.card.customW || 1080;
      customHEl.value = state.card.customH || 1440;
      fontFamilyEl.value = state.card.fontFamily;
      fontSizeEl.value = state.card.fontSize || 64;
      fontSizeValEl.textContent = `${state.card.fontSize || 64}px`;
      bgColorEl.value = state.card.bgColor || '#ffffff';
      textColorEl.value = state.card.textColor || '#1f2329';
      showDateEl.checked = state.card.showDate !== false;
      datePosEl.value = state.card.datePos || 'bottom-right';
      folderSuffixEl.value = state.card.suffix || '';

      initThemes();
      updateStatus();
      updateFolderPreview();
      updateScheduleUI();
    }

    async function initServerSync() {
      if (location.protocol !== 'file:') {
        try {
          const hRes = await fetch('/api/health', { cache: 'no-store' });
          if (hRes.ok) {
            const hData = await hRes.json();
            if (hData && hData.mode === 'server') {
              serverMode = true;
              serverOutputDir = hData.outputDir || '/output';
              serverFontLoaded = hData.fontLoaded || '';
              const sRes = await fetch('/api/state', { cache: 'no-store' });
              if (sRes.ok) {
                const sData = await sRes.json();
                if (sData && sData.ok && sData.state) state = sData.state;
              }
            }
          }
        } catch (_) {}
      }
      applyStateToUI();
    }

    // Events
    libSelect.addEventListener('change', async () => {
      state.activeLibraryId = libSelect.value;
      loadActiveLibIntoEditor();
      updateStatus();
      updateFolderPreview();
      await scheduleSyncToServer({ activeLibraryId: state.activeLibraryId }, true);
    });

    addLibBtn.addEventListener('click', async () => {
      const nextNum = state.libraries.length + 1;
      const name = prompt('请输入新任务库名称：', `${nextNum}号库`);
      if (name === null) return;
      const trimmed = name.trim() || `${nextNum}号库`;
      if (serverMode) {
        await scheduleSyncToServer({ addLibrary: { name: trimmed } }, true);
        loadActiveLibIntoEditor();
        showToast(`已新建任务库：${trimmed}`);
      } else {
        const id = `lib-${Date.now()}`;
        state.libraries.push({ id, name: trimmed, tasks: [], remaining: [], round: 1, enabled: true, count: 0 });
        state.activeLibraryId = id;
        persistLocal();
        applyStateToUI();
        showToast(`已新建任务库：${trimmed}`);
      }
    });

    delLibBtn.addEventListener('click', async () => {
      if (state.libraries.length <= 1) return;
      const lib = getActiveLib();
      if (!confirm(`确定删除任务库「${lib.name}」吗？`)) return;
      if (serverMode) {
        await scheduleSyncToServer({ deleteLibraryId: lib.id }, true);
        loadActiveLibIntoEditor();
        showToast(`已删除：${lib.name}`);
      } else {
        state.libraries = state.libraries.filter(l => l.id !== lib.id);
        state.activeLibraryId = state.libraries[0].id;
        persistLocal();
        applyStateToUI();
        showToast(`已删除：${lib.name}`);
      }
    });

    libNameInput.addEventListener('input', () => {
      const lib = getActiveLib();
      if (!lib) return;
      const nm = libNameInput.value.trim();
      if (!nm) return;
      lib.name = nm;
      renderLibSelect();
      updateFolderPreview();
      updateScheduleUI();
      scheduleSyncToServer({ updateLibrary: { id: lib.id, name: nm } });
    });

    libEnabledEl.addEventListener('change', () => {
      const lib = getActiveLib();
      if (!lib) return;
      lib.enabled = libEnabledEl.checked;
      updateScheduleUI();
      scheduleSyncToServer({ updateLibrary: { id: lib.id, enabled: lib.enabled } });
    });

    libCountEl.addEventListener('input', () => {
      const lib = getActiveLib();
      if (!lib) return;
      const c = Math.max(0, Number(libCountEl.value) || 0);
      lib.count = c;
      updateScheduleUI();
      scheduleSyncToServer({ updateLibrary: { id: lib.id, count: c } });
    });

    function syncTaskListFromText(rawText) {
      const lib = getActiveLib();
      if (!lib) return 0;
      const list = parseTasksText(rawText);
      if (!serverMode) {
        const oldSet = new Set(lib.tasks);
        const newSet = new Set(list);
        const kept = (lib.remaining || []).filter(t => newSet.has(t));
        const added = list.filter(t => !oldSet.has(t));
        lib.tasks = list;
        lib.remaining = kept.concat(added);
        persistLocal();
        renderLibSelect();
        updateStatus();
        updateScheduleUI();
      } else {
        lib.tasks = list;
        renderLibSelect();
        scheduleSyncToServer({ updateLibrary: { id: lib.id, tasks: list } });
      }
      return list.length;
    }

    taskInput.addEventListener('input', () => syncTaskListFromText(taskInput.value));

    importTxtBtn.addEventListener('click', () => importTxtInput.click());
    importTxtInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        taskInput.value = text;
        const count = syncTaskListFromText(text);
        showToast(`已导入 ${count} 条任务到「${getActiveLib().name}」`);
        importTxtInput.value = '';
      };
      reader.readAsText(file, 'utf-8');
    });

    exportTxtBtn.addEventListener('click', () => {
      const lib = getActiveLib();
      const content = serializeTasksText(lib ? lib.tasks : []) + '\n';
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${getCleanLibFolder()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    drawBtn.addEventListener('click', drawTask);
    saveImgBtn.addEventListener('click', saveImage);

    resetBtn.addEventListener('click', async () => {
      const lib = getActiveLib();
      if (!lib) return;
      if (serverMode) {
        const res = await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ libraryId: lib.id })
        });
        const data = await res.json();
        if (data.state) state = data.state;
      } else {
        lib.remaining = [...lib.tasks];
        lib.round = 1;
        persistLocal();
      }
      showResult(`已重置「${lib.name}」，点击抽取任务`, true);
      updateStatus();
    });

    toggleScheduleBtn.addEventListener('click', () => openPanel('schedule'));
    toggleCardBtn.addEventListener('click', () => openPanel('card'));
    toggleEditorBtn.addEventListener('click', () => openPanel('editor'));

    noRepeatEl.addEventListener('change', () => {
      state.noRepeat = noRepeatEl.checked;
      scheduleSyncToServer({ noRepeat: state.noRepeat });
      updateStatus();
    });

    saveSchedBtn.addEventListener('click', async () => {
      state.schedule.enabled = schedEnabledEl.checked;
      state.schedule.time = schedTimeEl.value || '00:00';
      state.schedule.count = Math.max(1, Number(schedCountEl.value) || 20);
      state.schedule.suffix = (schedSuffixEl.value || '').trim();
      state.schedule.autoResetOnEmpty = autoResetOnEmptyEl.checked;
      try {
        const res = await fetch('/api/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ schedule: state.schedule })
        });
        const data = await res.json();
        if (data.ok && data.state) {
          state = data.state;
          updateScheduleUI();
          showToast('定时任务设置已保存');
        }
      } catch (err) {
        showToast(`保存失败：${err.message}`, true);
      }
    });

    runBatchNowBtn.addEventListener('click', async () => {
      runBatchNowBtn.disabled = true;
      showToast('正在按任务库批量生成配图...');
      try {
        const res = await fetch('/api/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: dateValueEl.value || getTodayStr(),
            suffix: (schedSuffixEl.value || '').trim()
          })
        });
        const data = await res.json();
        if (data.state) state = data.state;
        renderLibSelect();
        updateStatus();
        updateScheduleUI();
        if (!data.ok) {
          showToast(data.error || '批量生成失败', true);
        } else {
          showToast(data.summary || `批量完成：共生成 ${data.generated} 张`);
        }
      } catch (err) {
        showToast(`批量生成失败：${err.message}`, true);
      } finally {
        runBatchNowBtn.disabled = false;
      }
    });

    cardTextEl.addEventListener('input', () => renderCanvas(previewCanvas, true));
    ratioPresetEl.addEventListener('change', () => {
      state.card.ratio = ratioPresetEl.value;
      customSizeRow.style.display = state.card.ratio === 'custom' ? 'flex' : 'none';
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    });
    [customWEl, customHEl].forEach(el => el.addEventListener('input', () => {
      state.card.customW = Number(customWEl.value) || 1080;
      state.card.customH = Number(customHEl.value) || 1440;
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    }));
    fontFamilyEl.addEventListener('change', () => {
      state.card.fontFamily = fontFamilyEl.value;
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    });
    fontSizeEl.addEventListener('input', () => {
      state.card.fontSize = Number(fontSizeEl.value);
      fontSizeValEl.textContent = `${state.card.fontSize}px`;
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    });
    bgColorEl.addEventListener('input', () => {
      state.card.themeIndex = -1;
      state.card.bgColor = bgColorEl.value;
      state.card.cardColor = bgColorEl.value;
      scheduleSyncToServer({ card: state.card });
      initThemes();
      renderCanvas(previewCanvas, true);
    });
    textColorEl.addEventListener('input', () => {
      state.card.themeIndex = -1;
      state.card.textColor = textColorEl.value;
      scheduleSyncToServer({ card: state.card });
      initThemes();
      renderCanvas(previewCanvas, true);
    });
    bgImageInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          bgImageObj = img;
          clearBgImgBtn.style.display = 'inline-block';
          renderCanvas(previewCanvas, true);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    clearBgImgBtn.addEventListener('click', () => {
      bgImageObj = null; bgImageInput.value = '';
      clearBgImgBtn.style.display = 'none';
      renderCanvas(previewCanvas, true);
    });
    showDateEl.addEventListener('change', () => {
      state.card.showDate = showDateEl.checked;
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    });
    dateValueEl.addEventListener('input', () => {
      updateFolderPreview();
      renderCanvas(previewCanvas, true);
    });
    datePosEl.addEventListener('change', () => {
      state.card.datePos = datePosEl.value;
      scheduleSyncToServer({ card: state.card });
      renderCanvas(previewCanvas, true);
    });
    folderSuffixEl.addEventListener('input', () => {
      state.card.suffix = folderSuffixEl.value;
      scheduleSyncToServer({ card: state.card });
      updateFolderPreview();
    });
    pickDirBtn.addEventListener('click', async () => {
      if (!window.showDirectoryPicker) return;
      try {
        selectedDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        updateFolderPreview();
        showToast(`已绑定保存目录：${selectedDirHandle.name}`);
      } catch (_) {}
    });

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        drawTask();
      }
    });

    dateValueEl.value = getTodayStr();
    initServerSync();
  </script>
</body>
</html>
